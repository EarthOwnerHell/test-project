  <body class="hero">
    <button class="theme-toggle" type="button" aria-pressed="false">
      Тема
    </button>
    <script defer>
      const KEY = "theme",
        btn = document.querySelector(".theme-toggle");
      const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
      if (
        localStorage.getItem(KEY) === "dark" ||
        (!localStorage.getItem(KEY) && prefersDark)
      ) {
        document.body.classList.add("theme-dark");
      }
      btn?.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("theme-dark");
        btn.setAttribute("aria-pressed", String(isDark));
        localStorage.setItem(KEY, isDark ? "dark" : "light");
      });
    </script>
    <header class="site-header">
      <a class="site-header__brand" href="http://127.0.0.1:3000/src/index.html"
        >Лого</a
      >
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">Главная</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="about.html">О нас</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link-- cta" href="contacts.html"
              >Связаться</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <nav aria-label="Хлебные крошки">
        <a href="index.html">Главная</a> →
        <span>Контакты</span>
      </nav>
      <h1>Контакты</h1>
      <section>
        <span>
          <a href="tel:+79098119201">+7 909 811 92 01</a>
        </span>
        <p>Сис. Админ</p>
      </section>
      <section>
        <span>
          <a href="tel:+79841234532">+7 984 123 45 32</a>
        </span>
        <p>Уборщица</p>
      </section>
      <section>
        <span>
          <a href="tel:+79011253128<">+7 901 125 31 28</a>
        </span>
        <p>Ночной сторож</p>
      </section>
      <section>
        <h2>Обратная связь</h2>
        <button id="openDialog" type="button">Написать нам</button>
      </section>
      <dialog id="contactDialog" aria-labelledby="dialogTitle">
        <h2 id="dialogTitle">Обратная связь</h2>
        <form id="contactForm" method="dialog" novalidate>
          <label for="name">Имя</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            minlength="2"
            autocomplete="given-name"
          />
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          />
          <label for="phone">Телефон</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            aria-describedby="phoneHelp"
            placeholder="+7 (___) ___-__-__"
            required
            pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
          />
          <small id="phoneHelp">Формат: +7 (900) 000-00-00</small>
          <label for="date">Дата</label>
          <input id="date" name="date" type="date" />
          <label for="topic">Тема</label>
          <select id="topic" name="topic" required>
            <option value="">Выберите тему</option>
            <option>Вопрос</option>
            <option>Заказ</option>
          </select>
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" rows="4" required></textarea>
          <div class="form-actions">
            <button class="formButton" type="button" id="closeDialog">
              Закрыть
            </button>
            <button class="formButton" type="submit">Отправить</button>
          </div>
        </form>
      </dialog>
    </main>

      <span
        >Телефон
        <a href="tel:+71234567890">+7 (123) 456-78-90</a>

  </body>
